name: Keep backend warm

on:
  schedule:
    # Every 10 minutes — Render free spins down after ~15 min idle
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -fsS --max-time 30 "${{ secrets.BACKEND_URL }}/health" \
            || curl -fsS --max-time 30 "${{ secrets.BACKEND_URL }}/"
