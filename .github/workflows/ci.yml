name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: landing_page_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/landing_page_db
      JWT_SECRET: test-secret-key-for-ci
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Backend
      - name: Install BE dependencies
        working-directory: landing-page-be
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        working-directory: landing-page-be
        run: npx prisma generate

      - name: Run migrations
        working-directory: landing-page-be
        run: npx prisma migrate deploy

      - name: Seed database
        working-directory: landing-page-be
        run: npm run seed

      - name: Build Backend
        working-directory: landing-page-be
        run: npm run build

      - name: Run BE unit tests
        working-directory: landing-page-be
        run: npm run test

      - name: Run BE e2e tests
        working-directory: landing-page-be
        run: npm run test:e2e

      # Frontend
      - name: Install FE dependencies
        working-directory: landing-page-fe
        run: npm ci --legacy-peer-deps

      - name: Lint Frontend
        working-directory: landing-page-fe
        run: npm run lint

      - name: Build Frontend
        working-directory: landing-page-fe
        run: npm run build
